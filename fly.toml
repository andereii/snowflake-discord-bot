# fly.toml app configuration file generated for snowflake-discord-bot-floral-river-8992 on 2026-08-06T01:46:42-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'snowflake-discord-bot-floral-river-8992'
primary_region = 'dfw'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  DATA_DIR = "/app/data"

[mounts]
  source = "snowflake_data"
  destination = "/app/data"
