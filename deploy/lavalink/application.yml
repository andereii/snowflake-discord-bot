server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Plugin YouTube: se mantiene SOLO para resolver búsquedas/metadatos (allowSearch).
    # El streaming desde IPs de datacenter está bloqueado por YouTube (todos los
    # clientes fallan con "Sign in" / 400 / "not a bot").
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    # Spotify, Apple Music, etc. Spotify reproduce por "mirroring"
    # (resuelve búsqueda en SoundCloud).
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false          # deshabilitado (roto). Lo sustituye el plugin de arriba.
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

# Configuración del plugin youtube-source
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TVHTML5_SIMPLY
      - WEB

  # Configuración del plugin LavaSrc (spotify, etc.)
  lavasrc:
    # SoundCloud como proveedor primario para mirroring de Spotify.
    # YouTube como último recurso (probablemente fallará en datacenter).
    providers:
      - "scsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true

logging:
  level:
    root: INFO
    lavalink: INFO