<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Snowflake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Módulos CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fa-solid fa-snowflake"></i> Snowflake
        </div>
        
        <div class="navbar-auth" id="auth-container">
            <a href="#" id="discord-login-btn" class="btn-discord">
                <i class="fa-brands fa-discord"></i> Iniciar sesión
            </a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="dashboard-container">
        <!-- Vista para usuarios SIN sesión -->
        <div id="login-prompt" class="view-section show">
            <h1>Bienvenido al Dashboard</h1>
            <p>Inicia sesión para administrar el bot en tus servidores.</p>
        </div>

        <!-- Vista para usuarios CON sesión (Servidores) -->
        <div id="servers-dashboard" class="view-section">
            <div class="servers-grid" id="servers-grid">
                <!-- Las tarjetas se inyectarán aquí dinámicamente -->
            </div>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- MODALES (Ocultos por defecto vía CSS)      -->
    <!-- ========================================== -->

    <!-- Modal 1: Lista de servidores para agregar el bot -->
    <div class="modal-overlay" id="add-server-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Añadir a un servidor</h2>
                <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body servers-list" id="invite-servers-list">
                <!-- Servidores pendientes se inyectan aquí -->
            </div>
        </div>
    </div>

    <!-- Modal 2: Pantalla completa para configurar (Iframe) -->
    <div class="modal-overlay fullscreen" id="config-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img id="config-server-icon" src="" alt="Icono del Servidor" style="width: 44px; height: 44px; border-radius: 12px; object-fit: cover; box-shadow: 0 2px 8px var(--color-shadow);">
                    <h2 id="config-server-name" style="margin: 0; color: var(--color-text-main);"></h2>
                </div>
                <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body iframe-container">
                <iframe id="config-iframe" src="" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- TEMPLATES (Ocultos en el DOM)              -->
    <!-- ========================================== -->
    
    <!-- Template: User Pill -->
    <template id="user-pill-template">
        <div class="user-dropdown-container">
            <button class="user-pill" id="user-pill-btn" aria-expanded="false" title="Opciones de cuenta">
                <span class="user-tag" id="user-tag-text">@usuario</span>
                <img class="user-avatar" id="user-avatar-img" src="" alt="Avatar">
            </button>
            <div class="user-dropdown-menu" id="user-dropdown-menu">
                <button class="btn-logout" id="logout-btn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión
                </button>
            </div>
        </div>
    </template>

    <!-- Template: Tarjeta Dashboard (Servidores ya configurados) -->
    <template id="server-card-template">
        <div class="server-card">
            <div class="server-banner"></div>
            <img class="server-icon" src="" alt="Icono">
            <div class="server-info">
                <h3 class="server-name">Nombre del Servidor</h3>
                <button class="btn-manage">Configurar <i class="fa-solid fa-gear"></i></button>
            </div>
        </div>
    </template>

    <!-- Template: Item de Lista (Para el modal de invitación) -->
    <template id="invite-item-template">
        <div class="invite-item">
            <div class="invite-item-info">
                <img class="invite-icon" src="" alt="Icono">
                <span class="invite-name">Nombre</span>
            </div>
            <a href="#" class="btn-manage btn-invite">Añadir bot <i class="fa-solid fa-plus"></i></a>
        </div>
    </template>

    <script type="module" src="js/auth/auth.js"></script>
</body>
</html>
